<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Filled by vite.standalone.config.ts. The stamp is what makes a stale
         upload visible from outside: itch hosts these bytes and nothing in this
         repo can fetch them back, so the bundle has to say what it was built
         from. assert-standalone.mjs requires it to equal the current tree. -->
    <meta name="ellaz:commit" content="__ELLAZ_COMMIT__" />
    <title>__ELLAZ_TITLE__</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #10121a;
        color: #f4f4f8;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #root {
        height: 100%;
      }
      #standalone-fallback {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        align-items: center;
        justify-content: center;
        height: 100%;
        padding: 1.5rem;
        text-align: center;
      }
      #standalone-fallback a {
        color: #ff4d8d;
      }
    </style>
  </head>
  <!-- data-game, read by src/standalone.tsx off the DOCUMENT and never off the
       URL. On itch the URL is a CDN path we have never seen. -->
  <body data-game="__ELLAZ_GAME__">
    <div id="root"></div>

    <!-- A sibling of #root, not a child: a node React does not know about
         inside a tree it reconciles is the nested-root teardown bug in a
         different costume. Removed on boot, never hidden. -->
    <div id="standalone-fallback">
      <p>__ELLAZ_TITLE__ needs JavaScript to run.</p>
      <p><a href="https://ellaz.fun/">Play it at ellaz.fun</a></p>
    </div>

    <script type="module" src="/src/standalone.tsx"></script>
  </body>
</html>
