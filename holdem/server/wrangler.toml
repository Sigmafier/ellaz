name = "holdem-server"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# SQLite-backed Durable Objects are the flavour available on the free plan —
# this must be new_sqlite_classes from day one; a KV-backed class cannot be
# migrated to SQLite later on free.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TableDO"]

# The lobby registry. Durable Objects cannot be enumerated, so "which tables
# are open" has to be reported into something — this is that something.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["LobbyDO"]

[[durable_objects.bindings]]
name = "TABLE"
class_name = "TableDO"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "LobbyDO"

[vars]
# Comma-separated list of allowed browser origins for WS/API calls.
# The pages.dev URL lands here once the first deploy exists.
# 5175 is this client's dev port and 4173 is vite preview's default. NOT 5173:
# that belongs to ProjectA's legacy Sigma app on this machine, and two apps sharing
# a localhost origin cross-contaminate each other's localStorage — which for an
# auth token is a phantom-401 cascade, and here would be one app reading the
# other's device token.
#
# https://poker.ellaz.fun is listed AHEAD of the DNS existing, and that order
# is the point. The origin check is the ONLY thing standing between the new
# hostname and a working game: a browser there sends
# `Origin: https://poker.ellaz.fun`, which is not `.pages.dev` and was not in
# this list, so every create and every socket answered 403 while the page
# itself rendered perfectly. Measured against the live worker before this
# line existed — 403 for poker.ellaz.fun, 200 for the pages.dev origin, 403
# for a hostile one, so it was the origin gate and not an accident.
#
# Listing a hostname that does not resolve costs nothing (nobody can send that
# Origin until it does). Landing it AFTER the DNS costs a window in which the
# site is up and completely broken.
ALLOWED_ORIGINS = "http://localhost:5175,http://localhost:4173,https://poker.ellaz.fun"
