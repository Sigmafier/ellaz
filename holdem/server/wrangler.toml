name = "holdem-server"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# SQLite-backed Durable Objects are the flavour available on the free plan —
# this must be new_sqlite_classes from day one; a KV-backed class cannot be
# migrated to SQLite later on free.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TableDO"]

# The lobby registry. Durable Objects cannot be enumerated, so "which tables
# are open" has to be reported into something — this is that something.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["LobbyDO"]

[[durable_objects.bindings]]
name = "TABLE"
class_name = "TableDO"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "LobbyDO"

[vars]
# Comma-separated list of allowed browser origins for WS/API calls.
# The pages.dev URL lands here once the first deploy exists.
# 5175 is this client's dev port and 4173 is vite preview's default. NOT 5173:
# that belongs to OGAS's legacy Sigma app on this machine, and two apps sharing
# a localhost origin cross-contaminate each other's localStorage — which for an
# auth token is a phantom-401 cascade, and here would be one app reading the
# other's device token.
ALLOWED_ORIGINS = "http://localhost:5175,http://localhost:4173"
