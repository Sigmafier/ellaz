name = "holdem-server"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# SQLite-backed Durable Objects are the flavour available on the free plan —
# this must be new_sqlite_classes from day one; a KV-backed class cannot be
# migrated to SQLite later on free.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TableDO"]

[[durable_objects.bindings]]
name = "TABLE"
class_name = "TableDO"

[vars]
# Comma-separated list of allowed browser origins for WS/API calls.
# *.pages.dev is allowed by pattern in index.ts, so the deploy preview and the
# production Pages URL both work without an edit here; the custom domain lands
# here when poker.ellaz.fun exists.
#
# 5175 is this client's dev port and 4173 is vite preview's default. NOT 5173:
# that belongs to OGAS's legacy Sigma app, and sharing a localhost origin
# cross-contaminates storage between two different apps — the machine-wide
# grounding rule in rules/projects/registry.md.
ALLOWED_ORIGINS = "http://localhost:5175,http://localhost:4173"
