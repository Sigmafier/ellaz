# Test → deploy server (Workers) → deploy client (Pages), atomically from one
# commit. Needs two repo secrets:
#   CLOUDFLARE_API_TOKEN   (Workers Scripts:Edit + Pages:Edit + D1/DO perms)
#   CLOUDFLARE_ACCOUNT_ID
# And one repo variable:
#   SERVER_URL             e.g. https://holdem-server.<account>.workers.dev
#
# First-time setup: run the deploy once, note the workers.dev URL, set
# SERVER_URL, add the pages.dev origin to ALLOWED_ORIGINS in wrangler.toml
# (or rely on the built-in *.pages.dev allowance), and re-run.

name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  deploy-server:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: wrangler deploy
        run: npx wrangler deploy
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-client:
    needs: deploy-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: build client
        run: npm run build --workspace=client
        env:
          VITE_SERVER_URL: ${{ vars.SERVER_URL }}
      - name: pages deploy
        run: npx wrangler pages deploy client/dist --project-name holdem
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
