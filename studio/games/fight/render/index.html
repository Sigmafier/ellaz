<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>fight - versus</title>
    <style>
      html, body { margin: 0; height: 100%; background: #fff6d8; font: 14px/1.4 system-ui, sans-serif; color: #4a3320; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; overflow: hidden; }
      #stage { line-height: 0; touch-action: none; }
      #help { margin: 0; padding: 0 16px; text-align: center; max-width: 640px; }
      #stats { margin: 0; padding: 0 16px; font-variant-numeric: tabular-nums; color: #7a5a3a; }
      #help kbd { background: #ffe9a8; border-radius: 4px; padding: 0 5px; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <p id="help">
      <kbd>arrows</kbd> or <kbd>WASD</kbd> walk, <kbd>space</kbd> swings.
      On a phone: drag the left half to walk, tap the right half to swing.
    </p>
    <p id="stats" hidden></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
