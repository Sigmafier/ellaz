name: Studio (art bible)

# studio/ is the third independent workspace in this repository, beside the
# games platform (src/) and the poker table (holdem/). Root `npm test` runs
# none of its tests (vitest's include is src/**), so without this workflow
# the studio's suite and its nine gates run nowhere.
#
# Same path-filter shape as holdem.yml, mirrored by a paths-ignore on the two
# ellaz deploys: a studio commit must not publish ellaz.fun, and an ellaz
# commit must not spend a runner here.
#
# Half the gates drive headless Chromium (render-smoke renders every style,
# atlas-coverage reads the sheet's pixels, the export itself composes the
# sheets), so Playwright's browser is installed before they run.

on:
  push:
    branches: [main]
    paths:
      - "studio/**"
      - ".github/workflows/studio.yml"
  pull_request:
    paths:
      - "studio/**"
      - ".github/workflows/studio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            studio/package-lock.json
            studio/toybox/package-lock.json

      - run: npm ci

      # The Toybox engine's cells are their own npm package: Phaser is a
      # devDependency of studio/toybox, not of studio/, and the studio
      # typecheck reads toybox/cells/phaser, which imports it. The first CI run
      # on the fight tree (2026-09-12) reded with "Cannot find module 'phaser'"
      # for exactly that reason, when the package still lived inside the game.
      - name: The engine's own dependencies (Phaser)
        run: npm ci
        working-directory: studio/toybox

      - name: Chromium for the browser-driven gates
        run: npx playwright-core install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      # One run, two reporters, then a count: vitest exits 0 on "No test
      # files found", so a green run is not evidence anything ran.
      - name: Tests
        run: npm test -- --reporter=default --reporter=json --outputFile=/tmp/studio-tests.json

      - name: Assert the suite is not vacuous
        run: |
          set -euo pipefail
          COUNT=$(node -p "require('/tmp/studio-tests.json').numTotalTests")
          echo "ran $COUNT tests"
          if [ "$COUNT" -lt 120 ]; then
            echo "::error::only $COUNT tests ran, expected at least 120. Did the vitest include stop matching?"
            exit 1
          fi

      - name: Build the gallery (shadcn on the ellaz tokens, one HTML file)
        run: npm run gallery:build

      - name: Export sheets, atlases, manifests, palettes
        run: npm run export

      # assert:fight re-runs studio/tools/facings-painter/reproduce.sh, which
      # paints the knight's facings with Pillow and diffs the PNG byte for byte.
      # Its default interpreter is a venv on the author's machine, so CI read
      # "has no Pillow" and the gates went red (runs 34769485318, 34789224965,
      # 2026-09-13). Pinned to the version the committed PNG was emitted with:
      # a fresh venv of pillow 12.3.0 on Python 3.14 re-emitted all three files
      # identical and the one-colour control still FIRED (measured 2026-09-14).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pillow for the facings generator
        run: |
          set -euo pipefail
          python -m pip install "pillow==12.3.0"
          echo "PY=$(command -v python)" >> "$GITHUB_ENV"

      # Every gate reads a different artifact; a green one says nothing
      # about what another would find.
      - name: The nine gates
        run: npm run assert:all

      # The gates' own controls: each plants the defects it claims to catch
      # and requires every one to fire. A gate nobody has watched fail is
      # not a gate.
      - name: The gates can still fail
        run: npm run assert:controls

      - name: Gallery shots (every route renders without a page error)
        run: npm run shots

      - uses: actions/upload-artifact@v4
        with:
          name: studio-export
          path: |
            studio/dist-export
            studio/dist-gallery/index.html
            studio/shots/gallery
          retention-days: 14
