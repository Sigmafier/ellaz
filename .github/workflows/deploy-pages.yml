name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # See deploy-hostinger.yml — a poker-only commit must not republish ellaz.
    paths-ignore:
      - "holdem/**"
      - ".github/workflows/holdem.yml"
      - ".github/workflows/deploy-holdem.yml"
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default depth-1 clone. `src/build/lastmod.ts`
          # derives each page's <lastmod> from the last commit that touched its
          # sources; with a shallow clone git can only report the single commit
          # it has, so all 48 pages would carry one identical date. That is the
          # "everything changed today" signal Google learns to discount, and it
          # would arrive looking perfectly plausible. The emitter detects a
          # shallow clone and omits the field rather than lying, so removing
          # this degrades the sitemap quietly instead of breaking the build.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # build:check = build + scripts/assert-precache.mjs. The gate is what makes
      # adding VITE_POSTHOG_KEY safe: PostHog is lazy-loaded, and a lazy chunk is
      # precached BY DEFAULT unless vite.config globIgnores names it. Without the
      # gate, setting the secret would silently put ~222 KiB back on every first
      # visit with a green deploy. With it, that build goes red instead.
      # See .claude/rules/precache-glob-sweeps-new-chunks.md.
      - name: Build (base = /ellaz/ for the project Pages site)
        run: npm run build:check
        env:
          BASE_PATH: /ellaz/
          # Optional. Unset, Vite substitutes undefined, the init is
          # dead-code-eliminated and no analytics ships at all.
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          # The REGION. Passed for the same reason as on the Hostinger job —
          # without it `analytics.ts` silently falls back to the US host and the
          # setting is unreachable rather than merely unset. Kept on BOTH jobs
          # deliberately: the two hosts must not disagree about where a child's
          # events go, and this copy being absent is exactly the kind of drift
          # that produces one compliant host and one that is not.
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
      # NO `cp dist/index.html dist/404.html` HERE.
      #
      # It used to live here, from when every route was a hash fragment and the
      # app shell was a reasonable answer to any path. The build now emits a real
      # `dist/404.html`, and copying the shell over it would replace a page that
      # says "nothing here" with one that answers 200-shaped content at every
      # wrong URL - a soft 404, which search engines treat worse than the missing
      # page. `scripts/assert-pages.mjs` asserts the two files differ, but it runs
      # inside `build:check` above, so it cannot see anything done after it.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Exposed so `verify` checks the URL Pages ACTUALLY published to, rather
    # than one hardcoded here. That address has already moved once - the repo
    # changed org on 2026-08-02 and `ytrofr.github.io/ellaz` stopped being it,
    # while every stale reference kept on looking plausible.
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A Pages deploy is atomic - the whole artifact is swapped or none of it is -
  # so it cannot produce the half-uploaded site that took ellaz.fun down on
  # 2026-08-08. This is here for the failure it CAN produce: a run that goes
  # green while the published site is something else, which is what a stale base
  # path, a wrong artifact or a silently skipped deploy all look like.
  #
  # It re-uses the artifact rather than rebuilding, because the question is what
  # was PUBLISHED - a second build could differ from the first and would then
  # verify a site nobody deployed.
  verify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: /tmp/pages-artifact
      - name: Unpack the artifact that was actually published
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -xf /tmp/pages-artifact/artifact.tar -C dist
          test -f dist/index.html
      - name: Verify the live Pages site is serving this build
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          # The script wants an ORIGIN and a BASE separately: the html already
          # carries base-prefixed asset paths, so folding the base into the
          # origin would double it.
          export SITE_URL="$(node -e 'console.log(new URL(process.argv[1]).origin)' "$PAGE_URL")"
          export BASE_PATH="$(node -e 'console.log(new URL(process.argv[1]).pathname)' "$PAGE_URL")"
          echo "verifying $SITE_URL$BASE_PATH"
          node scripts/assert-live.mjs
