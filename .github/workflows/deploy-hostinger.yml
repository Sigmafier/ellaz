name: Deploy to Hostinger (ellaz.fun)

on:
  push:
    branches: [main]
  workflow_dispatch:

# ellaz.fun is a different host from the Pages site, so this gets its own lane:
# an FTP hiccup must not hold up the Pages deploy, or be held up by it.
concurrency:
  group: hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail SOFT while the FTP secrets are missing. A red X on every push would
      # train us to ignore this workflow; a skipped run with a warning does not.
      - name: Check FTP credentials
        id: creds
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FTP_SERVER / FTP_USERNAME / FTP_PASSWORD are not set - skipping the ellaz.fun deploy. Add them under Settings > Secrets and variables > Actions."
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.creds.outputs.ready == 'true'

      # No BASE_PATH: ellaz.fun serves from the domain ROOT, unlike the Pages
      # site which lives under /ellaz/. Same source, two base paths, two hosts.
      # `npm run build` is also the type-check gate (tsc --noEmit), and
      # build:check adds scripts/assert-precache.mjs on top of it.
      #
      # That gate is what makes adding VITE_POSTHOG_KEY safe. PostHog is
      # lazy-loaded, and a lazy chunk is precached BY DEFAULT unless
      # vite.config globIgnores names it — so setting the secret before that
      # entry exists would put ~222 KiB back on every child's first visit
      # behind a green deploy. With the gate, that build goes red instead.
      # See .claude/rules/precache-glob-sweeps-new-chunks.md.
      - name: Build for the root domain
        if: steps.creds.outputs.ready == 'true'
        run: npm run build:check
        env:
          # Optional. Unset, Vite substitutes undefined, the init is
          # dead-code-eliminated and no analytics ships at all.
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}

      - name: Add the Apache config (404 document + cache headers)
        if: steps.creds.outputs.ready == 'true'
        run: cp deploy/hostinger.htaccess dist/.htaccess

      - name: Upload to Hostinger
        if: steps.creds.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTPS is what Hostinger offers on port 21. Set the repo variable
          # FTP_PROTOCOL to "ftp" only if the handshake fails.
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          # Hostinger presents a wildcard cert for *.hstgr.io, which matches
          # neither the FTP IP nor ftp.ellaz.fun — strict verification fails the
          # handshake outright. Verified 2026-08-02 by reading the served cert.
          security: loose
          local-dir: ./dist/
          # "./", NOT "public_html/". The FTP account is chrooted to
          # /home/<id>/domains/ellaz.fun/public_html, so its root already IS the
          # docroot — verified by listing it. Uploading to public_html/ would
          # nest the whole site one level down, where nothing serves it, and the
          # deploy would go green while ellaz.fun stayed frozen.
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          # The action keeps a .ftp-deploy-sync-state.json on the server and only
          # transfers what changed. These stay untouched so a stray panel file or
          # a mail directory is never swept up by the sync.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            default.php
            .well-known/**
