name: Deploy to Hostinger (ellaz.fun)

on:
  push:
    branches: [main]
  workflow_dispatch:

# ellaz.fun is a different host from the Pages site, so this gets its own lane:
# an FTP hiccup must not hold up the Pages deploy, or be held up by it.
concurrency:
  group: hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default depth-1 clone. `src/build/lastmod.ts`
          # derives each page's <lastmod> from the last commit that touched its
          # sources; with a shallow clone git can only report the single commit
          # it has, so all 48 pages would carry one identical date. That is the
          # "everything changed today" signal Google learns to discount, and it
          # would arrive looking perfectly plausible. The emitter detects a
          # shallow clone and omits the field rather than lying, so removing
          # this degrades the sitemap quietly instead of breaking the build.
          fetch-depth: 0

      # Fail SOFT while the FTP secrets are missing. A red X on every push would
      # train us to ignore this workflow; a skipped run with a warning does not.
      - name: Check FTP credentials
        id: creds
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FTP_SERVER / FTP_USERNAME / FTP_PASSWORD are not set - skipping the ellaz.fun deploy. Add them under Settings > Secrets and variables > Actions."
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.creds.outputs.ready == 'true'

      # No BASE_PATH: ellaz.fun serves from the domain ROOT, unlike the Pages
      # site which lives under /ellaz/. Same source, two base paths, two hosts.
      # `npm run build` is also the type-check gate (tsc --noEmit), and
      # build:check adds scripts/assert-precache.mjs on top of it.
      #
      # That gate is what makes adding VITE_POSTHOG_KEY safe. PostHog is
      # lazy-loaded, and a lazy chunk is precached BY DEFAULT unless
      # vite.config globIgnores names it — so setting the secret before that
      # entry exists would put ~222 KiB back on every child's first visit
      # behind a green deploy. With the gate, that build goes red instead.
      # See .claude/rules/precache-glob-sweeps-new-chunks.md.
      - name: Build for the root domain
        if: steps.creds.outputs.ready == 'true'
        run: npm run build:check
        env:
          # Optional. Unset, Vite substitutes undefined, the init is
          # dead-code-eliminated and no analytics ships at all.
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}

      - name: Add the Apache config (404 document + cache headers)
        if: steps.creds.outputs.ready == 'true'
        run: cp deploy/hostinger.htaccess dist/.htaccess

      # ── Upload ────────────────────────────────────────────────────────────
      #
      # `lftp mirror`, not SamKirkland/FTP-Deploy-Action, and the reason is a
      # real outage rather than a preference.
      #
      # That action keeps a `.ftp-deploy-sync-state.json` ON THE SERVER and
      # transfers only what the state says has changed. On 2026-08-08 a transfer
      # died mid-sync; the state had already been written; and from then on
      # every subsequent run compared against a state file that CLAIMED the
      # missing chunks were present, so it skipped them. ellaz.fun served
      # index.html referencing `index-DD5Sx_ZF.js` and `shell-BXwWnAdL.js`,
      # both 404 - a blank page - and a re-deploy reported success in 90
      # seconds while changing nothing. An incremental sync whose ledger can
      # disagree with the disk cannot self-heal, and the failure mode is
      # "everything is green and the site is blank".
      #
      # lftp holds no state. It compares against what is ACTUALLY on the server
      # every time, so a partial transfer is repaired by the next run rather
      # than remembered as done.
      #
      # THE ORDER IS THE OTHER HALF, and it matters more. Hashed assets go
      # first, HTML and sw.js second, because those two are the only files that
      # REFERENCE the hashes. A run that dies between the passes leaves the old
      # HTML pointing at assets that are all still present - the site is stale,
      # which is recoverable and invisible to a child - instead of new HTML
      # pointing at chunks that never arrived, which is blank. Nothing is
      # deleted, so an old hash stays fetchable for exactly this reason.
      - name: Upload to Hostinger
        if: steps.creds.outputs.ready == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # "./", NOT "public_html/". The FTP account is chrooted to
          # /home/<id>/domains/ellaz.fun/public_html, so its root already IS the
          # docroot — verified by listing it. Uploading to public_html/ would
          # nest the whole site one level down, where nothing serves it, and the
          # deploy would go green while ellaz.fun stayed frozen.
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || './' }}
        run: |
          set -euo pipefail
          command -v lftp >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq lftp; }

          # The script goes in a 0600 file rather than on the command line: an
          # argv carrying the password is readable from `ps` by anything else on
          # the runner, and GitHub's log masking does not reach that far.
          umask 077
          SCRIPT="$(mktemp)"
          {
            # Hostinger presents a wildcard cert for *.hstgr.io, which matches
            # neither the FTP IP nor ftp.ellaz.fun — strict verification fails
            # the handshake outright. Verified 2026-08-02 by reading the served
            # cert. The control channel and the data channel are both still
            # encrypted; only the name check is off.
            echo 'set ssl:verify-certificate no'
            echo 'set ftp:ssl-force true'
            echo 'set ftp:ssl-protect-data true'
            echo 'set ftp:passive-mode true'
            # Hostinger's FTP was answering in ~30s under load on 2026-08-08,
            # which is what tripped the previous action's default timeout.
            echo 'set net:timeout 60'
            echo 'set net:max-retries 4'
            echo 'set net:reconnect-interval-base 5'

            # lftp uploads to a temp name and renames on completion, so a dead
            # transfer never leaves a half-written file under the real name.
            # Keep that - but NOT under lftp's default `.in.*`, which is a
            # DOTFILE. Hostinger refused the rename on 2026-08-08:
            #   550 /assets/game-shadows-DHQKHaBb.js: Rename of hidden file
            #   /assets/.in.game-shadows-DHQKHaBb.js failed
            # and that killed a whole pass. Shared hosting commonly restricts
            # dotfiles; a visible temp name keeps the atomicity and drops the
            # restriction. Do NOT "fix" this by setting xfer:use-temp-file
            # false - that trades an intermittent failure for a torn file.
            echo 'set xfer:temp-file-name "lftp-tmp-*"'
            echo 'set cmd:fail-exit true'
            echo "open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\""
            echo "cd \"$FTP_SERVER_DIR\""

            # Retire the previous action's ledger. It currently asserts that
            # files which are not on the server are on the server, so leaving it
            # would re-arm the exact outage the moment anyone reverts this step.
            # Before fail-exit, because a missing file here is a success.
            echo 'rm -f .ftp-deploy-sync-state.json'
            echo 'set cmd:fail-exit true'

            # Remote directories first, so a `put` never lands nowhere.
            (cd dist && find . -type f -not -path './assets/*' -printf '%h\n') |
              sort -u | while read -r d; do
                [ "$d" = "." ] || echo "mkdir -pf \"${d#./}\""
              done

            # PASS 1 - the hashed assets, by mirror. Mirror is EXACT here and
            # only here: every name under assets/ contains a content hash, so a
            # changed file is a NEW file and "does the remote have this name"
            # is the whole question.
            echo 'mirror -R --parallel=4 --no-perms --verbose=1 dist/assets assets'

            # PASS 2 - everything else that is REFERENCED, forced.
            # PASS 3 - the files that NAME the hashes, forced, last.
            #
            # `put`, not `mirror`, and the reason is a bug this gate caught in
            # the commit that introduced it. `mirror` decides by comparing SIZE
            # and TIME, and an index.html that differs from the remote one only
            # in a content hash is BYTE-IDENTICAL IN LENGTH - so mirror skipped
            # all 49 pages while happily uploading the new assets. The result
            # was the outage's exact signature from the opposite direction: new
            # chunks present on the server, old HTML still pointing at the old
            # ones. That is the ledger defect again, wearing mirror's heuristic
            # instead of a JSON file, and it is why the correctness-critical
            # files are transferred unconditionally rather than diffed.
            #
            # No --delete anywhere: an orphaned old hash costs a few KB and is
            # what keeps stale HTML working if a run dies between the passes.
            for pass in other html; do
              if [ "$pass" = other ]; then
                find dist -type f -not -path 'dist/assets/*' \
                     -not -name '*.html' -not -name 'sw.js' | sort
              else
                find dist -type f \( -name '*.html' -o -name 'sw.js' \) | sort
              fi |
                while read -r f; do
                  rel="${f#dist/}"; d="$(dirname "$rel")"
                  echo "put -O \"$d\" \"$f\""
                done
            done
            echo 'bye'
          } > "$SCRIPT"

          # A generator that silently produces nothing would upload nothing and
          # still exit 0. Assert the shape before handing it to lftp: 49 pages
          # plus sw.js is the floor, and it is checked here rather than trusted.
          PUTS=$(grep -c '^put ' "$SCRIPT")
          echo "lftp script: $PUTS forced transfers + 1 mirror"
          [ "$PUTS" -ge 50 ] || { echo "::error::only $PUTS put commands - the file walk is broken"; exit 1; }

          lftp -f "$SCRIPT"
          rm -f "$SCRIPT"

      # ── The gate this repo did not have ───────────────────────────────────
      #
      # A green upload is not a changed website - that is the whole lesson of
      # 2026-08-08, and it had already been written down in
      # .claude/rules/verify-the-deploy-target-not-just-the-run.md before it
      # took the site down anyway, because nothing MECHANISED it.
      #
      # This asserts the live html references the same hashed assets as the
      # dist/ we just built, and that every one of them is fetchable. Both
      # halves are needed: "all assets 200" passes on a completely stale site,
      # and "the html matches" passes on a site whose chunks never arrived.
      - name: Verify the live site is serving this build
        if: steps.creds.outputs.ready == 'true'
        env:
          SITE_URL: https://ellaz.fun
          BASE_PATH: /
        # Hostinger's FTP write and its web tier are not in lockstep, so the
        # script retries the whole check before failing rather than sleeping a
        # fixed guess. A gate that reds on propagation gets ignored within a
        # week, and an ignored gate is the same as no gate - which is the exact
        # hole this step was added to close.
        run: node scripts/assert-live.mjs

      # Tell Bing what changed. ChatGPT Search and Copilot lean on Bing's
      # index, so this is the cheapest route into the answer engines - and it
      # submits only URLs whose <lastmod> moved, rather than all 48 every time.
      #
      # It runs AFTER verification on purpose: announcing a release that did not
      # land is worse than announcing it late.
      #
      # continue-on-error because a search-engine ping is not worth failing a
      # good release over: the site is already live and verified by this point,
      # and a red X here would read as "the deploy broke".
      - name: Ping IndexNow
        if: steps.creds.outputs.ready == 'true'
        continue-on-error: true
        run: node scripts/indexnow.mjs
