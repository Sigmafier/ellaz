<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!-- The `lang` and `dir` above are REWRITTEN at build time from
         CANONICAL_LOCALE by the page emitter (src/build/pages.ts), so the two
         literals are what a source reader and the dev server see, never a
         second source of truth. They said `he`/`rtl` until 2026-08-14, when
         English took the root and Hebrew moved to /he/. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- NO `user-scalable=no`. Blocking pinch-zoom fails WCAG 1.4.4 (resize to
         200%), and the 48 emitted content pages have always allowed zoom - so
         the app shell was the only surface in the project that refused it,
         which is what marked it as an oversight rather than a decision.
         The real use case is a parent zooming a Hebrew label for a child. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The default theme's browser chrome. Pinned to themes.ts by
         src/ui/theme-sync.test.ts, because this is a literal that cannot
         import anything and drifted silently for exactly that reason. -->
    <meta name="theme-color" content="#ff4d8d" />
    <!-- REWRITTEN at build time by replaceTitle() in src/build/pages.ts, which
         carries the why. Comments here ship to every visitor, so it stays short. -->
    <title>Ellaz - free browser games for kids and grown-ups</title>
  </head>
  <body class="app-shell">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
